<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Subtle drop shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Wood Handle -->
  <g filter="url(#shadow)">
    <!-- Base Handle -->
    <line x1="20" y1="140" x2="95" y2="65" stroke="#3e2312" stroke-width="16" stroke-linecap="round" />
    <line x1="20" y1="140" x2="95" y2="65" stroke="#6b3e1b" stroke-width="12" stroke-linecap="round" />
    <line x1="18" y1="138" x2="93" y2="63" stroke="#8b562e" stroke-width="4" stroke-linecap="round" />

    <!-- Handle Wrap / Grip (Dark Leather) -->
    <line x1="35" y1="125" x2="60" y2="100" stroke="#2a160a" stroke-width="18" stroke-linecap="round" />
    <line x1="35" y1="125" x2="60" y2="100" stroke="#4a2612" stroke-width="14" stroke-linecap="round" />
    <line x1="33" y1="123" x2="58" y2="98" stroke="#5a3622" stroke-width="4" stroke-linecap="round" />

    <!-- Grip texture rings -->
    <line x1="38" y1="118" x2="46" y2="126" stroke="#2a160a" stroke-width="3" stroke-linecap="round" />
    <line x1="45" y1="111" x2="53" y2="119" stroke="#2a160a" stroke-width="3" stroke-linecap="round" />
    <line x1="52" y1="104" x2="60" y2="112" stroke="#2a160a" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Ruby Head Arch -->
  <g filter="url(#shadow)">
    <!-- Top/Outer Facet (Lighter Ruby) -->
    <path d="M 35,15 Q 145,15 155,115 Q 106,54 35,15 Z" fill="#ff3366" />

    <!-- Top Edge Highlight -->
    <path d="M 35,15 Q 145,15 155,115" fill="none" stroke="#ffb3cc" stroke-width="4" stroke-linecap="round" />

    <!-- Center Ridge (Faceted Gem Look) -->
    <path d="M 35,15 Q 106,54 155,115" fill="none" stroke="#660022" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
